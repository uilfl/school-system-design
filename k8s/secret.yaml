# Example secret (use kubectl create secret or sealed-secrets in production)
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: school-saas
type: Opaque
data:
  # Values should be base64 encoded
  # echo -n 'your-secret-here' | base64
  DATABASE_URL: <base64-encoded-database-url>
  JWT_SECRET: <base64-encoded-jwt-secret>
  REFRESH_TOKEN_SECRET: <base64-encoded-refresh-secret>
  ENCRYPTION_KEY: <base64-encoded-encryption-key>
  AWS_ACCESS_KEY_ID: <base64-encoded-aws-key>
  AWS_SECRET_ACCESS_KEY: <base64-encoded-aws-secret>
